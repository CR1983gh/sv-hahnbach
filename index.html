<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SV Hahnbach 1949 e.V. — Alle Mannschaften</title>
<style>
  :root{--gelb:#9cc8f0;--gelbfg:#16324d;--schwarz:#5b8fc9;--hell:#edf5fd;--grau:#6b7f92;--card:#fff;--gruen:#1b8a3a;--rot:#c0392b;--fg:#24384d;--line:#d8e8f6;--line2:#c2daef;--hover:#e0eefb;--crestbg:#fff;--akz:#3f7fc0;--atagbg:#dbe9f6;--own:#fdeadb;--win:#cdeed8;--draw:#f7efd9;--lose:#f9d4da;--abs:#e6ebf1;
    --r-card:12px;--r-row:10px;--r-pill:999px;--r-mini:6px;
    --shadow-card:0 1px 4px rgba(0,0,0,.08);--shadow-row:0 1px 3px rgba(0,0,0,.07);
    --line-card:0px solid transparent;
    --font-head:inherit;--font-body:inherit;
    --head-transform:none;--head-spacing:normal;--head-weight:800}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
  body{font-family:var(--font-body);background:var(--hell);color:var(--fg);line-height:1.45}
  header{background:var(--schwarz);color:#fff;padding:1.6rem 1rem 1.2rem;text-align:center;position:relative}
  header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--gelb) 0 50%,#fff 50% 100%)}
  .wappen{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:14px;border:3px solid #fff;margin-bottom:.4rem;box-shadow:0 2px 8px rgba(0,0,0,.45)}
  div.wappen{display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:1.2rem;letter-spacing:-1px;background:var(--gelb);color:var(--schwarz);border-radius:50%}
  header h1{font-size:1.5rem;letter-spacing:.5px}
  header p{color:#cfcfcf;margin-top:.2rem;font-size:.88rem}
  .picker{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:2px solid var(--gelb);box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .picker-inner{max-width:980px;margin:0 auto;display:flex;gap:.35rem;flex-wrap:wrap;justify-content:center;align-items:center;padding:.55rem .6rem}
  .group-label{font-size:.72rem;font-weight:800;text-transform:uppercase;color:var(--grau);margin:0 .2rem 0 .5rem;letter-spacing:.5px}
  .tbtn{border:2px solid var(--line2);background:var(--card);color:var(--fg);border-radius:var(--r-pill);padding:.25rem .7rem .25rem .35rem;font-size:.82rem;font-weight:700;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap}
  .tbtn:hover{border-color:var(--gelb);background:var(--hover)}
  .tbtn.active{background:var(--schwarz);color:var(--gelb);border-color:var(--schwarz)}
  .tbtn img,.tbtn .crest-fb{width:22px;height:22px;border-radius:50%;object-fit:contain;background:var(--crestbg);flex:none}
  main{max-width:980px;margin:0 auto;padding:1rem .8rem}
  .team-head{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem;margin-bottom:.9rem}
  .team-head img{width:42px;height:42px;border-radius:50%;object-fit:contain;background:var(--crestbg);border:2px solid var(--gelb)}
  .team-head h2{font-size:1.3rem}
  .pyr{margin-top:1.4rem}
  .pyr .tablewrap{border:1px solid var(--line2);border-radius:0}
  .pyr tr.hahnbach td{background:var(--own);color:var(--fg);font-weight:800}
  tr.hahnbach td{background:var(--own);color:var(--fg);font-weight:800}
  /* Auf-/Abstiegszonen (Quelle bfv.de): farbiger Randbalken links */
  tr.z-A  td:first-child{box-shadow:inset 4px 0 0 #2e9e4f}
  tr.z-AR td:first-child{box-shadow:inset 4px 0 0 #8bc34a}
  tr.z-NR td:first-child{box-shadow:inset 4px 0 0 #f0a030}
  tr.z-N  td:first-child{box-shadow:inset 4px 0 0 #d32f2f}
  .zonelegend{display:flex;flex-wrap:wrap;gap:.35rem .55rem;align-items:center;font-size:.72rem;margin-top:.35rem}
  .zonelegend .lg{display:inline-block;width:.75rem;height:.75rem;border-radius:3px;margin-right:.15rem;vertical-align:-1px}
  .lg.z-A{background:#2e9e4f}.lg.z-AR{background:#8bc34a}.lg.z-NR{background:#f0a030}.lg.z-N{background:#d32f2f}
  td.pyr-eb{color:var(--grau);font-size:.72rem;text-transform:uppercase;letter-spacing:.3px}
  tr.pyr-hdr td{background:var(--line);color:var(--fg);font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:.3rem .5rem;border-bottom:1px solid var(--line2)}
  .pyr-stno{background:var(--line2);border-radius:999px;padding:.08rem .55rem;font-size:.68rem;margin-right:.5rem}
  .pyr a{color:inherit;text-decoration:none;border-bottom:1px dotted #bbb}
  .pyr-note{color:var(--grau);font-size:.72rem;margin-top:.4rem}

  .chip{background:var(--gelb);color:var(--schwarz);border-radius:var(--r-pill);padding:.15rem .65rem;font-size:.78rem;font-weight:800}
  .chip.dark{background:var(--schwarz);color:var(--gelb)}
  h3.sec{font-size:1rem;border-left:5px solid var(--gelb);padding-left:.5rem;margin:1.2rem 0 .5rem}
  h2,.sec{font-family:var(--font-head);text-transform:var(--head-transform);letter-spacing:var(--head-spacing);font-weight:var(--head-weight)}
  .card{background:var(--card);border-radius:var(--r-card);padding:.7rem .8rem;box-shadow:var(--shadow-card);border:var(--line-card);margin-bottom:.8rem}
  td.gdate{font-weight:700;font-size:.78rem;color:var(--grau);white-space:nowrap;vertical-align:middle}
  td.gdate .wd{color:var(--akz)}
  .cd{font-size:.68rem;color:var(--grau)}
  .venue3{color:var(--grau);font-weight:400;font-size:.68rem;white-space:normal;max-width:8em;line-height:1.15}
  td.gteam{white-space:nowrap;overflow:hidden;width:34%;vertical-align:middle}
  .gw{display:flex;align-items:center;min-width:0}
  .starme{flex:none;margin-left:.25rem}
  .gteam.home .gw{justify-content:flex-end}
  td.gteam.home{justify-content:flex-end;text-align:right}
  td.gteam.away{text-align:left}
  td.gteam .t{vertical-align:middle;display:inline-block;max-width:calc(100% - 30px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  td.gteam .crest{width:20px;height:20px;margin:0 .4rem;vertical-align:middle}
  td.gscore{text-align:center;white-space:nowrap}
  td.gha{white-space:nowrap}
  tr.g-S{background:var(--win)}
  tr.g-U{background:var(--draw)}
  tr.g-N{background:var(--lose)}
  tr.g-A{background:var(--abs)}
  @media (max-width: 620px){
    /* Spiele-Tabellen muessen ohne seitliches Scrollen passen */
    .tablewrap:has(.gdate){overflow:visible}
    .tablewrap:has(.gdate) table{table-layout:fixed;width:100%}
    td.gdate, th:nth-child(1){font-size:.68rem;width:15%}
    .yr, .venue3{display:none}
    td.gteam, th:nth-child(2), th:nth-child(4){width:36.5%}
    .gscore, th:nth-child(3){width:10%}
    td.gteam .crest{width:17px;height:17px;margin:0 .25rem}
    /* volle Namen: Umbruch statt Abschneiden */
    td.gteam{white-space:normal}
    td.gteam .t{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.15;max-width:calc(100% - 22px)}
    .gscore, .score{font-size:.74rem;padding:.03rem .3rem}
    td.gha, th.hc{width:6%;padding:0;overflow:hidden}
    .home-tag{padding:.02rem .14rem;font-size:.58rem;margin:0}
    .tag-s{display:inline}.tag-l{display:none}
  }
  .spiel{display:block;padding:.55rem .2rem;border-bottom:1px dashed #e2e0d8}
  .spiel:last-child{border-bottom:none}
  .row1{display:flex;align-items:center;gap:.5rem;min-width:0;justify-content:space-between}
  .when{font-weight:700;font-size:.82rem;color:var(--grau);white-space:nowrap}
  .when .wd{color:var(--akz)}
  .vsline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.2rem .5rem;font-size:.9rem;margin-top:.15rem}
  .vsline .cell{display:flex;align-items:center;gap:.35rem;min-width:0}
  .vsline .cell.home{justify-content:flex-end}
  .vsline .cell.away{justify-content:flex-start}
  .vsline .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vsline .mid{flex:none}
  .crest{width:22px;height:22px;border-radius:50%;object-fit:contain;background:var(--crestbg);flex:none}
  .crest-fb{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--crestbg);align-items:center;justify-content:center;font-size:.7rem;flex:none}
  .tagcol{display:flex;align-items:center;gap:.4rem;flex:none}
  .venue2{display:inline;color:var(--grau);font-weight:400;font-size:.75rem;margin-left:.4rem}
  .home-tag{font-size:.68rem;font-weight:800;border-radius:4px;padding:.05rem .35rem;white-space:nowrap}
  .tag-l{display:none}
  @media(min-width:760px){.tag-s{display:none}.tag-l{display:inline}}
  .home-tag.h{background:var(--gelb);color:var(--schwarz)}
  .home-tag.a{background:var(--atagbg);color:var(--grau)}
  .venue{font-size:.72rem;color:var(--grau);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
  .score{font-weight:900;background:var(--schwarz);color:var(--gelb);border-radius:var(--r-mini);padding:.05rem .4rem;white-space:nowrap;flex:none}
  .score.sc-S{background:var(--gruen);color:#fff}
  .score.sc-U{background:#e08a00;color:#fff}
  .score.sc-N{background:var(--rot);color:#fff}
  .score.sc-A{background:#6b6b6b;color:#fff;font-size:.68rem;letter-spacing:.5px}
  .spiel.resrow-A{background:var(--abs);border-left:4px solid #6b6b6b;border-radius:0 10px 10px 0;padding-left:.5rem}
  .res-S{font-size:.72rem;font-weight:800;color:#fff;background:var(--gruen);padding:.15rem .5rem;border-radius:999px}
  .res-U{font-size:.72rem;font-weight:800;color:#fff;background:#e08a00;padding:.15rem .5rem;border-radius:999px}
  .res-N{font-size:.72rem;font-weight:800;color:#fff;background:var(--rot);padding:.15rem .5rem;border-radius:999px}
  .spiel.resrow-S{background:var(--win);border-left:4px solid var(--gruen)}
  .spiel.resrow-U{background:var(--draw);border-left:4px solid #e08a00}
  .spiel.resrow-N{background:var(--lose);border-left:4px solid var(--rot)}
  .spiel.resrow-S,.spiel.resrow-U,.spiel.resrow-N{border-radius:0 10px 10px 0;padding-left:.5rem}
  .formbar{display:flex;gap:.3rem;margin:.4rem 0;align-items:center}
  .formbar .flbl{font-size:.62rem;font-weight:700;color:var(--grau);margin-right:.15rem}
  .fchip{min-width:1.4rem;height:1.4rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:var(--fg);flex:none}
  .fchip.c-S{background:var(--win)}
  .fchip.c-U{background:var(--draw)}
  .fchip.c-N{background:var(--lose)}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:0}
  table{width:100%;border-collapse:collapse;font-size:.84rem;background:var(--card)}
  th{background:var(--schwarz);color:var(--gelb);text-align:left;padding:.45rem .5rem;font-size:.74rem;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  td{padding:.4rem .5rem;border-bottom:1px solid var(--line);white-space:nowrap}
  td.tname{white-space:normal;min-width:150px}
  td.tname .crest{width:20px;height:20px;margin-right:.45rem;vertical-align:middle}
  /* core columns (Pl., Team, Sp., Pkt.) fit the phone screen; extras scroll sideways */
  /* numeric columns Sp./Pkt./S-U-N/Tore/Diff. evenly spaced */
  .tablewrap.st table{table-layout:fixed}
  .tablewrap.st th:nth-child(1){width:5.5%}
  .tablewrap.st th:nth-child(2){width:auto}
  .tablewrap.st th:nth-child(n+3){width:10.9%;text-align:center}
  .tablewrap.st td:nth-child(n+3){text-align:center}
  /* Teamname: immer komplett, einheitliche Schriftgroesse, notfalls 2-zeilig */
  .tablewrap.st td.tname{white-space:normal;min-width:0}
  .tablewrap.st td.tname .gw{overflow:visible}
  .tablewrap.st td.tname .t{white-space:normal;max-width:calc(100% - 26px);overflow-wrap:anywhere}
  @media (max-width: 560px){
    th, td{padding-left:.35rem; padding-right:.35rem}
    td.tname{min-width:125px}
    td.pkt{font-weight:800}
  }
  tr.hahnbach td{background:var(--own);color:var(--fg);font-weight:800}
  .links a{color:var(--akz);font-size:.82rem;text-decoration:none;margin-right:.8rem}
  .links a:hover{text-decoration:underline}
  .empty{color:var(--grau);font-style:italic;padding:.4rem .2rem}
  footer{background:var(--schwarz);color:#bbb;text-align:center;padding:1.1rem;font-size:.78rem;margin-top:1.5rem}
  .note{font-size:.78rem;color:var(--grau)}
  /* Desktop: venue beside, one line */
  @media(min-width:760px){
    .spiel{display:grid;grid-template-columns:170px 1fr auto;align-items:center}
    .row1{display:contents}
    .when{grid-column:1}
    .vsline{grid-column:2;display:flex;align-items:center;gap:.4rem;font-size:.92rem;margin-top:0}
    .vsline .cell{display:contents}
    .vsline .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
    .tagcol{grid-column:3;grid-row:1}
    .venue2{display:none}
  }
  /* Übersicht "Alle Teams" */
  .ovcard{background:var(--card);border-radius:var(--r-card);padding:.6rem .7rem;box-shadow:var(--shadow-card);border:var(--line-card)}
  .ovhead{display:flex;align-items:center;gap:.4rem;cursor:pointer;font-weight:700}
  .ovcols{display:flex;gap:.8rem;margin-top:.4rem;font-size:.78rem}
  .ovcol{flex:1;min-width:0}
  @media(max-width:520px){.ovcols{flex-direction:column;gap:.3rem}}
  .ovlbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.4px;color:var(--grau)}
  .ovwrap{display:flex;flex-direction:column;gap:.55rem}
  .ovhead .ovname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ovchips{margin-left:auto;display:flex;gap:.3rem;align-items:center;flex-wrap:wrap;justify-content:flex-end;flex:none;max-width:55%}
  .ovchip{background:var(--gelb);color:var(--schwarz);border-radius:999px;padding:.1rem .5rem;font-size:.62rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .ovchip.dark{background:var(--schwarz);color:var(--gelb)}
  .ovrow{display:flex;align-items:center;gap:.35rem;min-width:0;margin-top:.15rem}
  .ovdate{font-weight:800;flex:none}
  .ovgeg{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ovha{flex:none;font-size:.6rem;font-weight:900;border:1.5px solid var(--grau);color:var(--grau);border-radius:var(--r-mini);padding:0 .22rem;line-height:1.35}
  .ovnone{color:var(--grau)}
  .ovbtn{border-color:var(--akz,var(--gelb));background:var(--gelb);color:var(--schwarz)}
  .ovbtn.active{background:var(--schwarz);color:var(--gelb);border-color:var(--schwarz)}
  /* Sub-Tabs auf der Übersichtsseite */
  .ovtabs{display:flex;gap:.35rem;margin-bottom:.6rem;flex-wrap:wrap}
  .ovtab{border:1.5px solid var(--grau);background:var(--card);color:var(--fg);border-radius:var(--r-pill);padding:.28rem .7rem;font-size:.74rem;font-weight:700;cursor:pointer}
  .ovtab.on{background:var(--schwarz);color:var(--gelb);border-color:var(--schwarz)}
  .ovday{font-size:.7rem;font-weight:800;color:var(--grau);text-transform:uppercase;letter-spacing:.4px;margin:.7rem 0 .25rem}
  .ovgame{display:flex;align-items:center;gap:.5rem;background:var(--card);border-radius:var(--r-row);padding:.4rem .55rem;margin-bottom:.3rem;box-shadow:var(--shadow-row);border:var(--line-card);min-width:0}
  .ovwhen{flex:none;font-size:.68rem;color:var(--grau);font-weight:700;min-width:3.6rem}
  .ovmatch{flex:1;min-width:0;display:flex;align-items:center;gap:.3rem;flex-wrap:wrap;font-size:.78rem}
  .ovteamchip{flex:none;font-size:.62rem;font-weight:800;color:var(--akz);background:transparent;border:1px solid var(--akz);border-radius:999px;padding:.05rem .45rem;cursor:pointer;white-space:nowrap}
  .ovgame[onclick]{cursor:pointer}
  .ovgame.ovtoday{outline:2px solid var(--akz);background:color-mix(in srgb, var(--akz) 8%, var(--card))}
  .ovheute{display:inline-block;font-size:.58rem;font-weight:900;color:var(--gelb);background:var(--schwarz);border-radius:var(--r-mini);padding:0 .3rem;letter-spacing:.5px}
  .ovvenue{font-size:.62rem;color:var(--grau);flex-basis:100%;padding-left:.2rem}
  .ovmatch .score{margin-left:auto}
  .ovown{font-weight:800}
  .ovcd{font-size:.62rem;color:var(--akz)}
  .ovtbl{margin-bottom:.8rem;min-width:0}
  .ovth{display:flex;align-items:center;gap:.4rem;margin:.5rem 0 .3rem;font-weight:800;font-size:.88rem;min-width:0}
  .ovth .ovtname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media(max-width:520px){.ovgame{flex-wrap:wrap}.ovteamchip{order:-1;width:max-content}}
  /* ===== Style-System (nur Form/Typografie, keine Farben) ===== */
  .styleSel{font-size:.66rem;padding:.15rem .3rem;border-radius:var(--r-mini);border:1px solid var(--grau);background:var(--card);color:var(--fg);max-width:8em}
  [data-style="brutal"]{--r-card:0;--r-row:0;--r-pill:0;--r-mini:0;--shadow-card:none;--shadow-row:none;--line-card:2px solid var(--schwarz);--head-transform:uppercase;--head-spacing:.5px;--head-weight:900}
  [data-style="brutal"] .ovtab{border-width:2px}
  [data-style="editorial"]{--r-card:0;--r-row:0;--r-pill:0;--r-mini:0;--shadow-card:none;--shadow-row:none;--font-head:Georgia,'Times New Roman',serif;--head-weight:700;--head-spacing:.2px}
  [data-style="editorial"] .ovgame{border-bottom:1px solid var(--grau);border-radius:0;box-shadow:none;background:transparent}
  [data-style="editorial"] .ovcard{border-bottom:1px solid var(--grau);border-radius:0;box-shadow:none}
  [data-style="kissen"]{--r-card:20px;--r-row:16px;--shadow-card:0 4px 14px rgba(0,0,0,.10);--shadow-row:0 3px 10px rgba(0,0,0,.08)}
  [data-style="kissen"] .ovgame{padding:.65rem .8rem}
  [data-style="kissen"] .card{padding:.9rem 1rem}
  [data-style="terminal"]{--font-body:ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;--font-head:ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;--r-card:2px;--r-row:2px;--r-pill:2px;--r-mini:2px;--shadow-card:none;--shadow-row:none;--line-card:1px dashed var(--grau);--head-transform:uppercase;--head-spacing:1px;--head-weight:700}
  [data-style="zeilen"]{--r-card:0;--r-row:0;--shadow-card:none;--shadow-row:none}
  [data-style="zeilen"] .ovgame{border-bottom:1px solid color-mix(in srgb, var(--grau) 40%, transparent);border-radius:0;padding:.45rem .3rem}
  [data-style="zeilen"] .card{background:transparent;box-shadow:none;border-radius:0;border-top:1px solid color-mix(in srgb, var(--grau) 40%, transparent)}

  /* ==== Styles: Flaeche-auf-Komponenten (Supervisor-Ausbau) ==== */
  /* --- BRUTAL: Neo-Brutalismus --- */
  [data-style="brutal"] header::after{background:var(--gelb);height:8px}
  [data-style="brutal"] header h1{letter-spacing:2px}
  [data-style="brutal"] .picker{border-bottom:2px solid var(--schwarz);box-shadow:none}
  [data-style="brutal"] .tbtn{box-shadow:none;border-color:var(--schwarz)}
  [data-style="brutal"] .tbtn.active{box-shadow:none}
  [data-style="brutal"] .tbtn img,[data-style="brutal"] .tbtn .crest-fb{border-radius:0;border:1px solid var(--schwarz)}
  [data-style="brutal"] .group-label{letter-spacing:1.5px}
  [data-style="brutal"] h3.sec{border-left:7px solid var(--gelb);background:color-mix(in srgb,var(--gelb) 18%,transparent)}
  [data-style="brutal"] th{border-bottom:2px solid #000}
  [data-style="brutal"] td{border-bottom:1px solid #000}
  [data-style="brutal"] .chip,[data-style="brutal"] .score{border:2px solid var(--schwarz)}
  [data-style="brutal"] .fchip{border-radius:0;border:2px solid var(--schwarz)}
  [data-style="brutal"] .crest{border-radius:0;border:1px solid var(--line2)}
  [data-style="brutal"] .pyr-stno{border-radius:0;border:1px solid var(--schwarz)}
  [data-style="brutal"] .zonelegend .lg{border-radius:0;border:1px solid var(--schwarz)}
  [data-style="brutal"] .ovteamchip{border-width:2px;box-shadow:none}
  [data-style="brutal"] .note,[data-style="brutal"] footer,[data-style="brutal"] .pyr-note{text-transform:uppercase;letter-spacing:.5px;font-size:.66rem}

  /* --- EDITORIAL: Zeitungslayout --- */

function countdownText(dateStr, timeStr){
  if (!dateStr) return '';
  const p = String(dateStr).split('.').map(Number);
  if (p.length < 3 || p.some(n => !Number.isFinite(n))) return '';
  const hm = String(timeStr || '').split(':').map(Number);
  const std = hm.length > 1 && Number.isFinite(hm[0]) ? hm[0] : 15;
  const min = hm.length > 1 && Number.isFinite(hm[1]) ? hm[1] : 0;
  const diff = new Date(p[2], p[1]-1, p[0], std, min) - new Date();
  if (diff <= 0) return '';
  if (diff < 60*60*1000) return 'jetzt';
  if (diff < 24*60*60*1000){ const n = Math.floor(diff/(60*60*1000)); return 'in ' + n + (n === 1 ? ' Stunde' : ' Stunden'); }
  if (diff < 21*24*60*60*1000){ const n = Math.floor(diff/(24*60*60*1000)); return 'in ' + n + (n === 1 ? ' Tag' : ' Tagen'); }
  return '';
}

function shortName(s){

function basekey(s){
  let t = s.replace(/^\(([^()]+)\)$/, '$1');           // '(SpVgg Ebermannsdorf)' -> 'SpVgg Ebermannsdorf'
  t = t.replace(/\((SG|SG1|SpVgg|SV|TSV|FC|DJK|SC|TuS|JFG|FSV|VfB|TSG|TV)\)\s+/g, '');  // '(SG) X' -> 'X'
  return t.replace(/\s*-\s*Kinderfestival/g,'')
          .replace(/\s+(zg\.|I{1,3}|1|2|3)$/,'').replace(/\s+/g,' ').trim();
}
function badgeFor(name){ return BADGES[basekey(name)] || BADGES[name] || null; }

  if (u) return `<img class="crest" src="${u}" alt="" loading="lazy" onerror="this.outerHTML='<span class=\\'crest-fb\\'>⚽</span>'">`;
  return `<span class="crest-fb">⚽</span>`;
}
function isHahnbach(name){ return /Hahnbach/.test(name); }
function resultClass(g){
  const [a,b] = g.score.split(':').map(Number);
  const hn = isHahnbach(g.home);
  const my = hn ? a : b, other = hn ? b : a;
  return my > other ? 'S' : my === other ? 'U' : 'N';
}

function kurzName(t){
  const m = t.match(/^(U\d+)\s*(?:(I{1,3}|\d))?\s*\((.)-Junioren\)$/);
  if (!m) return t;
  const num = {'':1,'I':1,'II':2,'III':3,'IV':4}[m[2] !== undefined ? m[2] : ''];
  return m[1] + ' ' + m[3] + (num || parseInt(m[2], 10) || 1);
}

function pyrBlock(team, liga, staffelId){
  const jg = TEAM_JG[team];
  if (!jg || !PYRAMIDE[jg]) return '';
  const tiers = PYRAMIDE[jg];
  const norm = s => s.replace(/\s+/g,' ').replace(/AM\/WEN/g,'AM/WEN').replace(/\(D-?Jun\.?\)/g,'').toLowerCase();
  // dezente Ebenen-Kurznamen statt Farbcodes
  const EBKURZ = { 'Profi':'Profi-Bundesligen', 'Bundes':'Bundesliga-NLZ', 'Region':'Regionalliga', 'Verband':'Verband', 'Bezirk':'Bezirk', 'Kreis':'Kreis' };
  const ebKurz = (ebene, name) => {
    if (ebene === 'Verband' && /NLZ/.test(name)) return 'BFV-NLZ';
    return EBKURZ[ebene] || ebene;
  };
  const kreisKlasse = name => {
    const n = name.toLowerCase();
    // BFV-Notation: Q-KL = Kreisliga, Q-KK = Kreisklasse
    if (/kreisliga/.test(n) || /-kl\b/.test(n) || /-kl /.test(n)) return 'Kreisliga';
    if (/kreisklasse/.test(n) || /-kk\b/.test(n) || /-kk /.test(n)) return 'Kreisklasse';
    if (/a-?klasse/.test(n)) return 'A-Klasse';
    if (/b-?klasse/.test(n)) return 'B-Klasse';
    if (/c-?klasse/.test(n)) return 'C-Klasse';
    return 'Gruppe';
  };
  let rows = '', lastKey = null;
  for (const t of tiers){
    const key = t.st + '|' + t.ebene;
    if (key !== lastKey){
      lastKey = key;
      const kl = t.ebene === 'Kreis' ? ' — ' + kreisKlasse(t.name) : '';
      rows += `<tr class="pyr-hdr"><td colspan="2"><span class="pyr-stno">Stufe ${t.st}</span>${esc(ebKurz(t.ebene, t.name))}${esc(kl)}</td></tr>`;
    }
    const own = (staffelId && t.id === staffelId) ||
                (!staffelId && (norm(liga).includes(norm(t.name)) || norm(t.name).includes(norm(liga))));
    const label = esc(t.name) + (own ? ' ⭐' : '');
    const inner = t.id ? `<a href="https://www.bfv.de/ergebnisse/wettbewerb/-/${t.id}" target="_blank" rel="noopener">${label}</a>` : label;
    const ebName = ebKurz(t.ebene, t.name);
    rows += `<tr class="${own ? 'hahnbach' : ''}"><td class="tname">${inner}</td><td class="pyr-eb">${esc(ebName)}</td></tr>`;
  }
  return `<div class="pyr"><h3 class="sec">🏟️ Ligen-Pyramide ${esc(jg.replace(/ \(.-Junioren\)/,''))}</h3><div class="tablewrap"><table><thead><tr><th>Liga</th><th>Ebene</th></tr></thead><tbody>${rows}</tbody></table></div><div class="pyr-note">Quelle: BFV — von der untersten Gruppe bis zur Spitze. Klick öffnet Tabelle &amp; Ergebnisse auf bfv.de. ⭐ = Spielklasse des eigenen Teams.</div></div>`;
}

  const d = DATA[team];

    const [dd,mm,yy] = g.date.split('.').map(Number);
    const JUNK = /TORREICHSTES|HÖCHSTER|HÖCHSTE|ZUSAMMENFASSUNG|SPIELFREI|Abgesetzt/;
    return new Date(yy, mm-1, dd) >= new Date(2026, 8, 22) && g.home && g.away && g.home.length > 2
      && !JUNK.test(g.home) && !JUNK.test(g.away);
  });
  const m = d.meta;
  const view = document.getElementById('teamView');

  let h = `<div class="team-head">${crest('SV Hahnbach')}<h2>${esc(kurzName(team))}</h2><span class="chip">${esc(m.liga)}</span>`;
  if (m.platz != null) h += `<span class="chip dark">Platz ${m.platz} · ${esc(m.tv)}</span>`;
  h += `</div>`;

  // Formbar: letzte 5 Spiele mit Ergebnis (älteste links, neuestes rechts)
  const formGames = (d.results||[]).filter(g => g.score && !/\D/.test(g.score.replace(':', '')));
  const formLast5 = formGames.slice(-5);
  if (formLast5.length){
    let chips = '';
    for (const g of formLast5){
      const [fa, fb] = g.score.split(':').map(Number);
      if (isNaN(fa) || isNaN(fb)) continue;
      const ownHome = isHahnbach(g.home);
      const own = ownHome ? fa : fb, opp = ownHome ? fb : fa;
      const cls = own > opp ? 'S' : own < opp ? 'N' : 'U';
      const lbl = cls === 'S' ? 'Sieg' : cls === 'N' ? 'Niederlage' : 'Unentschieden';
      chips += `<span class="fchip c-${cls}" title="${esc(g.date + ' ' + g.home + ' ' + g.score + ' ' + g.away + ' — ' + lbl)}">${esc(cls)}</span>`;
    }
    if (chips) h += `<div class="formbar"><span class="flbl">Form:</span>${chips}</div>`;
  }

  // Nächste Spiele: Karten-Zeilen im Look der Übersicht (.ovday/.ovgame/.ovwhen/.ovmatch)
  h += `<h3 class="sec">📅 Nächste Spiele</h3>`;
  if (!d.games.length){
    h += `<div class="empty">Derzeit keine Spiele angesetzt.</div>`;
  } else {
    let lastN = null;
    d.games.forEach(g => {
      if (g.date !== lastN){
        lastN = g.date;
        h += `<div class="ovday">${esc(weekday(g.date))}., ${esc(g.date.slice(0, 5))}.</div>`;
      }
      const cd = countdownText(g.date, g.time);
      h += `<div class="ovgame">
        <div class="ovwhen">${esc(g.date.slice(0, 5))}<div>${esc(g.time || '')}</div>${cd ? `<div class="ovcd">⏳ ${esc(cd)}</div>` : ''}</div>
        <div class="ovmatch">${ovMatchHtml(g)}</div>
        ${g.venue ? `<div class="ovvenue">📍 ${esc(String(g.venue).split(',')[0])}</div>` : ''}
      </div>`;
    });
  }

  // Ergebnisse: gleiche Karten-Zeilen, neueste zuerst, mit Ergebnis-Pill
  h += `<h3 class="sec">🏁 Ergebnisse Saison 26/27</h3>`;
  const JUNK = /TORREICHSTES|HÖCHSTER|HÖCHSTE|ZUSAMMENFASSUNG|SPIELFREI|Abgesetzt|\d\s-\s\(?SG\)?\sSV\sHahnbach/;
  const res = (d.results||[]).filter(g => !JUNK.test(g.home) && !JUNK.test(g.away)).slice().reverse();
  if (!res.length){
    h += `<div class="empty">Noch keine Ergebnisse in dieser Saison (bzw. keine erfassten Pflichtspielergebnisse).</div>`;
  } else {
    let lastR = null;
    res.forEach(g => {
      if (g.date !== lastR){
        lastR = g.date;
        h += `<div class="ovday">${esc(weekday(g.date))}., ${esc(g.date.slice(0, 5))}.</div>`;
      }
      const isAbsage = /ausgefallen|abgesagt/i.test(g.score || '');
      const mid = isAbsage
        ? `<span class="score sc-A">ABGESAGT</span>`
        : (g.score ? `<span class="score sc-${resultClass(g)}">${esc(g.score)}</span>` : `<span style="color:var(--grau);flex:none">–</span>`);
      h += `<div class="ovgame">
        <div class="ovwhen">${esc(g.date.slice(0, 5))}</div>
        <div class="ovmatch">${ovMatchHtml(g)}${mid}</div>
        ${g.venue ? `<div class="ovvenue">📍 ${esc(String(g.venue).split(',')[0])}</div>` : ''}
      </div>`;
    });
  }

  if (d.standings && d.standings.length) {
    const z = d.zones || [0,0,0,0];  // [Aufstieg, Aufstiegs-Relegation, Abstiegs-Relegation, Abstieg]
    const n = d.standings.length;
    const zoneOf = pos => {
      if (pos <= z[0]) return 'z-A';
      if (pos <= z[0] + z[1]) return 'z-AR';
      if (n - pos < z[3]) return 'z-N';
      if (n - pos < z[3] + z[2]) return 'z-NR';
      return '';
    };
    h += `<h3 class="sec">📊 Tabelle — ${esc(m.liga)}</h3><div class="tablewrap st">`;
    h += `<table><thead><tr><th>Pl.</th><th>Team</th><th>Sp.</th><th>Pkt.</th><th class="xcol">S-U-N</th><th class="xcol">Tore</th><th class="xcol">Diff.</th></tr></thead><tbody>`;
    d.standings.forEach(r => {
      const me = isHahnbach(r.name);
      const zc = zoneOf(parseInt(r.pos, 10) || 0);
      h += `<tr class="${(me?'hahnbach':'') + (zc?' '+zc:'')}"><td>${esc(r.pos)}</td><td class="tname"><span class="gw">${crest(r.name)}<span class="t" title="${esc(r.name)}">${esc(shortName(r.name))}</span>${me?'<span class="starme">⭐</span>':''}</span></td>
        <td>${esc(r.sp)}</td><td class="pkt">${esc(r.pkt)}</td>
        <td class="xcol">${esc(r.g)}-${esc(r.u)}-${esc(r.v)}</td>
        <td class="xcol">${esc(r.tor)}</td>
        <td class="xcol">${Number(r.diff)>0?'+':''}${esc(r.diff)}</td></tr>`;
    });
    h += `</tbody></table></div>`;
    if (z.some(x => x > 0)) {
      const parts = [];
      if (z[0]) parts.push(`<span class="lg z-A"></span>Aufstieg (${z[0]})`);
      if (z[1]) parts.push(`<span class="lg z-AR"></span>Relegation Aufstieg (${z[1]})`);
      if (z[2]) parts.push(`<span class="lg z-NR"></span>Relegation Abstieg (${z[2]})`);
      if (z[3]) parts.push(`<span class="lg z-N"></span>Abstieg (${z[3]})`);
      h += `<p class="note zonelegend">${parts.join(' · ')} — Quelle: bfv.de</p>`;
    }
  } else {
    h += `<h3 class="sec">📊 Tabelle</h3><p class="note">Für ${esc(m.liga)} wird beim BFV keine Tabelle geführt (Kinderfestival / Freundschaftsrunde).</p>`;
  }

  h += pyrBlock(team, m.liga, m.staffel);

  h += `<p class="links" style="margin-top:1rem"><a href="${m.bfv}" target="_blank" rel="noopener">Team auf bfv.de →</a>
    ${m.liga_bfv ? `<a href="${m.liga_bfv}" target="_blank" rel="noopener">Liga auf bfv.de →</a>` : (m.fupa ? `<a href="${m.fupa}" target="_blank" rel="noopener">Liga auf FuPa →</a>` : '')}</p>`;

  view.innerHTML = h;
  const font = getComputedStyle(document.body).fontFamily;
  view.querySelectorAll('.gteam .t').forEach(el => {
    const cs = getComputedStyle(el);
    const f = cs.fontWeight + ' ' + cs.fontSize + ' ' + font;
    let txt = el.textContent;
    let guard = 0;
    while (el.scrollWidth > el.clientWidth + 1 && guard < 40) {
      const next = fitName(txt, Math.max(60, el.clientWidth), f);
      if (next !== txt) { txt = next; el.textContent = txt; guard++; continue; }
      // rules exhausted: shrink font before cutting anything
      const cur = parseFloat(getComputedStyle(el).fontSize);
      if (cur > 11.5) { el.style.fontSize = (cur - 0.5) + 'px'; guard++; continue; }
      break;
    }
  });
  window.scrollTo({top: 0, behavior: 'smooth'});
}



function ovGegner(name){
  let s = shortName(name || '');
  s = s.replace(/\((SG|SG1)\)\s*/g, '');
  return s.trim();
}

let ovTab = 'next';

function ovDateCmp(dateStr){
  const p = String(dateStr || '').split('.').map(Number);
  if (p.length < 3 || p.some(n => !Number.isFinite(n))) return null;
  return new Date(p[2], p[1]-1, p[0]);
}
function ovTeamChip(team){
  return `<button class="ovteamchip" onclick="select('${team.replace(/'/g, "\\'")}')">${esc(kurzName(team))}</button>`;
}
function ovMatchHtml(g){
  const hn = ovGegner(g.home), an = ovGegner(g.away);
  return crest(g.home) +
    `<span class="${isHahnbach(g.home) ? 'ovown' : ''}" title="${esc(g.home)}">${esc(hn)}</span>` +
    `<span style="color:var(--grau)">–</span>` +
    `<span class="${isHahnbach(g.away) ? 'ovown' : ''}" title="${esc(g.away)}">${esc(an)}</span>` +
    crest(g.away);
}

function ovNextBlock(){
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const all = [];
  Object.keys(DATA).forEach(team => {
    ((DATA[team] || {}).games || []).forEach(g => {
      if ((g.score || '') !== '' || !g.home || !g.away) return;
      const dt = ovDateCmp(g.date);
      if (!dt || dt < today) return;
      all.push({ team, g, dt });
    });
  });
  all.sort((a, b) => (a.dt - b.dt) || String(a.g.time || '').localeCompare(String(b.g.time || '')));
  if (!all.length) return `<div class="empty">Derzeit keine zukünftigen Spiele angesetzt.</div>`;
  let h = '', last = null;
  all.forEach(({ team, g, dt }) => {
    if (g.date !== last){
      last = g.date;
      h += `<div class="ovday">${esc(weekday(g.date))}., ${esc(g.date.slice(0, 5))}.</div>`;
    }
    const cd = countdownText(g.date, g.time);
    const isToday = !!dt && dt.getTime() === today.getTime();
    h += `<div class="ovgame${isToday ? ' ovtoday' : ''}">
      <div class="ovwhen">${esc(g.time || g.date.slice(0, 5))}${cd ? `<div class="ovcd">⏳ ${esc(cd)}</div>` : ''}${isToday ? '<div><span class="ovheute">HEUTE</span></div>' : ''}</div>
      <div class="ovmatch">${ovMatchHtml(g)}</div>
      ${ovTeamChip(team)}
    </div>`;
  });
  return h;
}

function ovResultsBlock(){
  const all = [];
  Object.keys(DATA).forEach(team => {
    ((DATA[team] || {}).results || []).forEach(g => {
      const sc = String(g.score || '').trim();
      if (!/^\d+:\d+$/.test(sc) || !g.home || !g.away) return;
      all.push({ team, g: Object.assign({}, g, { score: sc }) });
    });
  });
  all.sort((a, b) => (ovDateCmp(b.g.date) || 0) - (ovDateCmp(a.g.date) || 0));
  const top = all.slice(0, 30);
  if (!top.length) return `<div class="empty">Keine Ergebnisse gefunden.</div>`;
  let h = '', last = null;
  top.forEach(({ team, g }) => {
    if (g.date !== last){
      last = g.date;
      h += `<div class="ovday">${esc(weekday(g.date))}., ${esc(g.date.slice(0, 5))}.</div>`;
    }
    const cls = resultClass(g);
    h += `<div class="ovgame">
      <div class="ovwhen">${esc(g.date.slice(0, 5))}</div>
      <div class="ovmatch">${ovMatchHtml(g)}<span class="score sc-${cls}">${esc(g.score)}</span></div>
      ${ovTeamChip(team)}
    </div>`;
  });
  return h;
}

function ovTableBlock(){
  let h = '';
  Object.keys(DATA).forEach(team => {
    const d = DATA[team] || {}, st = d.standings || [], m = d.meta || {};
    if (!st.length) return;
    const me = st.find(r => /Hahnbach/.test(r.name || ''));
    const diff = me ? Number(me.diff) : NaN;
    const dchip = me ? `<span class="ovchip dark" style="margin-left:auto">${diff > 0 ? '+' : ''}${esc(me.diff)}</span>` : '';
    h += `<div class="ovtbl">
      <div class="ovth"><span class="ovtname">${esc(kurzName(team))}</span><span class="ovchip">${esc(m.liga || '')}</span></div>
      ${me ? `<div class="ovgame" onclick="select('${team.replace(/'/g, "\\'")}')">
        <div class="ovmatch">Pl. ${esc(me.pos)} · ${esc(me.pkt)} Pkt · ${esc(me.g)}-${esc(me.u)}-${esc(me.v)} · ${esc(me.tor)}</div>
        ${dchip}
      </div>` : `<div class="empty">Eigener Tabellenplatz nicht erfasst.</div>`}
    </div>`;
  });
  return h || `<div class="empty">Keine Tabellen verfügbar.</div>`;
}

function ovBodyHtml(){
  return ovTab === 'res' ? ovResultsBlock() : ovTab === 'tbl' ? ovTableBlock() : ovNextBlock();
}
function ovSetTab(t){
  ovTab = t;
  document.querySelectorAll('.ovtab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  const body = document.getElementById('ovBody');
  if (body) body.innerHTML = ovBodyHtml();
}

function renderOverview(){
  document.querySelectorAll('.tbtn').forEach(b => b.classList.toggle('active', b === ovBtn));
  const view = document.getElementById('teamView');
  view.innerHTML = `<h3 class="sec">🏟️ Alle Mannschaften</h3>
    <div class="ovtabs">
      <button class="ovtab${ovTab === 'next' ? ' on' : ''}" data-tab="next" onclick="ovSetTab('next')">📅 Nächste Spiele</button>
      <button class="ovtab${ovTab === 'res' ? ' on' : ''}" data-tab="res" onclick="ovSetTab('res')">📊 Ergebnisse</button>
      <button class="ovtab${ovTab === 'tbl' ? ' on' : ''}" data-tab="tbl" onclick="ovSetTab('tbl')">🏆 Tabellen</button>
    </div>
    <div id="ovBody">${ovBodyHtml()}</div>`;
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// Design-Sprache (Form/Typografie) umschalten
function applyStyle(s){document.documentElement.dataset.style=s;try{localStorage.setItem('hbStyle',s)}catch(e){}}
const styleSel = document.getElementById('styleSel');
const st = localStorage.getItem('hbStyle') || 'modern';
applyStyle(st);
styleSel.value = st;
styleSel.onchange = function(){ applyStyle(this.value); };

select('U13 (D-Junioren)');

// Manual update check: fetch live page with cache-buster, compare data hash
function checkForUpdate(btn){
  const msg = document.getElementById('refreshMsg');
  btn.disabled = true; btn.textContent = '⏳ Prüfe…';
  const localData = JSON.stringify(DATA);
  fetch(location.href.split('?')[0] + '?cb=' + Date.now(), {cache:'no-store'})
    .then(r => r.text())
    .then(t => {
      const m = t.match(/const DATA = \/\*__DATA__\*\/(\{.*?\});\s*const BADGES/s);
      if (!m) throw new Error('no data');
      // Normalize: compare parsed JSON, not raw text (whitespace differs after minify)
      const isNew = JSON.stringify(JSON.parse(m[1])) !== JSON.stringify(JSON.parse(localData));
      if (isNew) {
        msg.textContent = '✅ Neue Daten verfügbar – Seite wird geladen…';
        location.reload();
      } else {
        msg.textContent = 'ℹ️ Keine neuen Daten – du hast schon den aktuellsten Stand.';
        btn.disabled = false; btn.textContent = '🔄 Auf Aktualisierung prüfen';
      }
    })
    .catch(() => {
      msg.textContent = '⚠️ Konnte nicht prüfen (offline?).';
      btn.disabled = false; btn.textContent = '🔄 Auf Aktualisierung prüfen';
    });
}
</script>
