    [/Schlösser-Eck/g, 'Schlösser-E.'],
  [/Bergsteig/g, 'Bergst.'],
    [/(^|\s)Eintracht(\s|$)/g, '$1Eintr.$2'],
  [/(^|\s)1\. FC(\s|$)/g, '$1FC$2'],
  [/(^|\s)1\.(\s)/g, '$1$2'],
];
const _cv = document.createElement('canvas');
const _cx = _cv.getContext('2d');
function textW(s, font){ _cx.font = font; return _cx.measureText(s).width; }
function fitName(s, maxW, font){
  for (const [re, rep] of FIT_RULES) {
    if (textW(s, font) <= maxW) return s;
    s = s.replace(re, rep);
  }
  return s;
}
function shortName(s){
  s = s.trim();
  if (SHORT[s]) return SHORT[s];
  s = s.replace(/\(SG[^)]*\)\s?/g,'');
  s = s.replace(/\s+-\s+Kinderfestival/g,' (Kinderf.)').replace(/\s+/g,' ').trim();
  if (SHORT[s]) return SHORT[s];
  return s;
}

function basekey(s){
  return s.replace(/\(SG\)\s?/g,'').replace(/\s*-\s*Kinderfestival/g,'')
          .replace(/\s+(I{1,3}|1|2|3)$/,'').replace(/\s+/g,' ').trim();
}
function badgeFor(name){ return BADGES[basekey(name)] || BADGES[name] || null; }
function crest(name){
  const u = badgeFor(name);
  if (u) return `<img class="crest" src="${u}" alt="" loading="lazy" onerror="this.outerHTML='<span class=\\'crest-fb\\'>⚽</span>'">`;
  return `<span class="crest-fb">⚽</span>`;
}
function isHahnbach(name){ return /Hahnbach/.test(name); }
function resultClass(g){
  const [a,b] = g.score.split(':').map(Number);
  const hn = isHahnbach(g.home);
  const my = hn ? a : b, other = hn ? b : a;
  return my > other ? 'S' : my === other ? 'U' : 'N';
}

const picker = document.getElementById('picker');
GROUPS.forEach(g => {
  const lbl = document.createElement('span');
  lbl.className = 'group-label'; lbl.textContent = g.label;
  picker.appendChild(lbl);
  g.teams.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tbtn'; b.dataset.team = t;
    const short = t.replace(/ \((.)-Junioren\)/, ' $1');
    b.innerHTML = crest(t) + '<span>' + esc(short) + '</span>';
    b.onclick = () => select(t);
    picker.appendChild(b);
  });
});

function gameRow(g, withScore){
  const isHome = isHahnbach(g.home);
  const venue = g.venue ? esc(g.venue.split(',')[0]) : '';
  const isAbsage = withScore && /ausgefallen|abgesagt/i.test(g.score || '');
  const cls = withScore && !isAbsage ? resultClass(g) : '';
  const mid = isAbsage
    ? `<span class="score sc-A">ABGESAGT</span>`
    : withScore
    ? `<span class="score sc-${cls}">${esc(g.score)}</span>`
    : `<span style="color:var(--grau);flex:none">–</span>`;
  let hn = shortName(g.home), an = shortName(g.away);
  const font = '700 ' + (window.innerWidth >= 760 ? '14.7px' : '14.4px') + " 'Segoe UI',system-ui,sans-serif";
  const maxW = Math.max(120, (window.innerWidth - 110) / 2);
  hn = fitName(hn, maxW, font); an = fitName(an, maxW, font);
  return `<div class="spiel${withScore && !isAbsage ? ' resrow-' + cls : (isAbsage ? ' resrow-A' : '')}">
    <div class="row1"><span class="when"><span class="wd">${weekday(g.date)}.</span> ${esc(g.date)}${g.time ? ' · ' + esc(g.time) : ''}</span><span class="venue2">${venue}</span><span class="tagcol"><span class="home-tag ${isHome?'h':'a'}"><span class="tag-s">${isHome?'H':'A'}</span><span class="tag-l">${isHome?'HEIM':'AUSWÄRTS'}</span></span></span></div>
    <div class="vsline"><span class="cell home"><span class="t">${esc(hn)}</span>${crest(g.home)}</span><span class="mid">${mid}</span><span class="cell away">${crest(g.away)}<span class="t">${esc(an)}</span></span></div>
  </div>`;
}

function select(team){
  document.querySelectorAll('.tbtn').forEach(b => b.classList.toggle('active', b.dataset.team === team));
  const d = DATA[team];
  d.games = (d.games||[]).filter(g => {
    const [dd,mm,yy] = g.date.split('.').map(Number);
    const JUNK = /TORREICHSTES|HÖCHSTER|HÖCHSTE|ZUSAMMENFASSUNG|SPIELFREI|Abgesetzt/;
    return new Date(yy, mm-1, dd) >= new Date(2026, 8, 22) && g.home && g.away && g.home.length > 2
      && !JUNK.test(g.home) && !JUNK.test(g.away);
  });
  const m = d.meta;
  const view = document.getElementById('teamView');

  let h = `<div class="team-head">${crest(team)}<h2>${esc(team)}</h2><span class="chip">${esc(m.liga)}</span>`;
  if (m.platz != null) h += `<span class="chip dark">Platz ${m.platz} · ${esc(m.tv)}</span>`;
  h += `</div>`;

  h += `<h3 class="sec">📅 Nächste Spiele</h3><div class="card">`;
  h += d.games.length ? d.games.map(g => gameRow(g, false)).join('')
                     : `<div class="empty">Derzeit keine Spiele angesetzt.</div>`;
  h += `</div>`;

  h += `<h3 class="sec">🏁 Ergebnisse Saison 26/27</h3><div class="card">`;
  const JUNK = /TORREICHSTES|HÖCHSTER|HÖCHSTE|ZUSAMMENFASSUNG|SPIELFREI|Abgesetzt|\d\s-\s\(?SG\)?\sSV\sHahnbach/;
  const res = (d.results||[]).filter(g => !JUNK.test(g.home) && !JUNK.test(g.away)).slice().reverse();
  h += res.length ? res.map(g => gameRow(g, true)).join('')
                  : `<div class="empty">Noch keine Ergebnisse in dieser Saison (bzw. keine erfassten Pflichtspielergebnisse).</div>`;
  h += `</div>`;

  if (d.standings && d.standings.length) {
    h += `<h3 class="sec">📊 Tabelle — ${esc(m.liga)}</h3><div class="tablewrap">`;
    h += `<table><thead><tr><th>Pl.</th><th>Team</th><th>Sp.</th><th>Diff.</th><th>Pkt.</th><th class="xcol">S-U-N</th><th class="xcol">Tore</th></tr></thead><tbody>`;
    d.standings.forEach(r => {
      const me = isHahnbach(r.name);
      h += `<tr class="${me?'hahnbach':''}"><td>${esc(r.pos)}</td><td class="tname">${crest(r.name)}${esc(shortName(r.name))}${me?' ⭐':''}</td>
        <td>${esc(r.sp)}</td><td>${Number(r.diff)>0?'+':''}${esc(r.diff)}</td><td class="pkt">${esc(r.pkt)}</td>
        <td class="xcol">${esc(r.g)}-${esc(r.u)}-${esc(r.v)}</td>
        <td class="xcol">${esc(r.tor)}</td></tr>`;
    });
    h += `</tbody></table></div>`;
  } else {
    h += `<h3 class="sec">📊 Tabelle</h3><p class="note">Für ${esc(m.liga)} wird beim BFV keine Tabelle geführt (Kinderfestival / Freundschaftsrunde).</p>`;
  }

  h += `<p class="links" style="margin-top:1rem"><a href="${m.bfv}" target="_blank" rel="noopener">Team auf bfv.de →</a>
    ${m.fupa ? `<a href="${m.fupa}" target="_blank" rel="noopener">Liga auf FuPa →</a>` : ''}</p>`;

  view.innerHTML = h;
  // precise fit: shorten or shrink font so no name is cut off
  const font = getComputedStyle(document.body).fontFamily;
  view.querySelectorAll('.vsline .t').forEach(el => {
    const cs = getComputedStyle(el);
    const f = cs.fontWeight + ' ' + cs.fontSize + ' ' + font;
    let txt = el.textContent;
    let guard = 0;
    while (el.scrollWidth > el.clientWidth + 1 && guard < 40) {
      const next = fitName(txt, Math.max(60, el.clientWidth), f);
      if (next !== txt) { txt = next; el.textContent = txt; guard++; continue; }
      // rules exhausted: shrink font before cutting anything
      const cur = parseFloat(getComputedStyle(el).fontSize);
      if (cur > 11.5) { el.style.fontSize = (cur - 0.5) + 'px'; guard++; continue; }
      break;
    }
  });
  window.scrollTo({top: 0, behavior: 'smooth'});
}

select('Herren');

// Manual update check: fetch live page with cache-buster, compare data hash
function checkForUpdate(btn){
  const msg = document.getElementById('refreshMsg');
  btn.disabled = true; btn.textContent = '⏳ Prüfe…';
  const localData = JSON.stringify(DATA);
  fetch(location.href.split('?')[0] + '?cb=' + Date.now(), {cache:'no-store'})
    .then(r => r.text())
    .then(t => {
      const m = t.match(/const DATA = \/\*__DATA__\*\/(\{.*?\});\s*const BADGES/s);
      if (!m) throw new Error('no data');
      // Normalize: compare parsed JSON, not raw text (whitespace differs after minify)
      const isNew = JSON.stringify(JSON.parse(m[1])) !== JSON.stringify(JSON.parse(localData));
      if (isNew) {
        msg.textContent = '✅ Neue Daten verfügbar – Seite wird geladen…';
        location.reload();
      } else {
        msg.textContent = 'ℹ️ Keine neuen Daten – du hast schon den aktuellsten Stand.';
        btn.disabled = false; btn.textContent = '🔄 Auf Aktualisierung prüfen';
      }
    })
    .catch(() => {
      msg.textContent = '⚠️ Konnte nicht prüfen (offline?).';
      btn.disabled = false; btn.textContent = '🔄 Auf Aktualisierung prüfen';
    });
}
</script>
