name: Update site data
on:
  schedule:
    # Mo-Fr: 15:30, 18:00 und 21:00 deutsche Zeit (Spiele fruehestens ab 14 Uhr)
    - cron: '30 13 * * 1-5'
    - cron: '0 16,19 * * 1-5'
    # Sa+So: alle 30 Minuten, 10:00-20:30 deutsche Zeit (Spielbetrieb)
    - cron: '0,30 8-18 * * 6,0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet pypdf pytest
      - run: python3 -m pytest tests/ -q
      - run: python3 update_site.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
